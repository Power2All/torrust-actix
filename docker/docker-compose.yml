services:
  torrust_actix:
    image: power2all/torrust-actix:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      LOG_LEVEL: "debug"
      # Required: `TRACKER__API_KEY=$(head -c 32 /dev/urandom | base64) docker compose up`
      TRACKER__API_KEY: "${TRACKER__API_KEY:?set TRACKER__API_KEY to a long random string}"
      TRACKER__SWAGGER: "true"
      DATABASE__PERSISTENT: "false"
      DATABASE__ENGINE: "sqlite3"
      DATABASE__PATH: "sqlite://:memory:"
    container_name: "torrust_actix"
    hostname: "torrust_actix"
    ports:
      - "127.0.0.1:8080:8080/tcp" # API: loopback only; publish it wider only behind TLS or a firewall
      - "6969:6969/tcp" # TCP Tracker
      - "6969:6969/udp" # UDP Tracker
