[workspace]
members = ["."]
default-members = ["."]
resolver = "3"

[package]
name = "torrust-actix"
version = "4.2.24"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
authors = ["Power2All <info@power2all.com>"]
description = "A rich, fast and efficient Bittorrent Tracker."
homepage = "https://www.torrust-actix.com"
repository = "https://github.com/Power2All/torrust-actix"
documentation = "https://docs.rs/torrust-actix"
readme = "README.md"
keywords = ["bittorrent", "tracker", "actix", "rtctorrent", "webrtc"]
categories = ["network-programming", "web-programming::http-server"]

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = 'abort'
incremental = false
codegen-units = 1
rpath = false
strip = "debuginfo"

[profile.release.package."*"]
opt-level = 3

[dependencies]
actix-cors = "0.7.2"
# Every default feature except `http2`: actix offers h2 over TLS through ALPN, and the h2 0.3 it
# pulls in has RUSTSEC-2026-0258 (unbounded empty DATA frames) with no 0.3 fix. HTTP/1.1 is all a
# tracker and its API need.
actix-web = { version = "4.17.0", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat", "ws", "rustls-0_23"] }
actix-ws = "0.4.0"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
rmp-serde = "1.3.1"
bip_bencode = "0.4.4"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
fern = { version = "0.7.1", features = ["colored"] }
futures-util = "0.3.34"
hex = "0.4.3"
log = "0.4.34"
parking_lot = { version = "0.12.5", features = ["arc_lock", "hardware-lock-elision", "serde", "deadlock_detection"] }
percent-encoding = "2.3.2"
rcgen = "0.14.10"
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring"] }
# `reqwest` + `rustls` rather than `transport`, which adds `native-tls`: that linked OpenSSL in
# beside the rustls everything else uses, and made OpenSSL headers a build requirement.
sentry = { version = "0.49.3", default-features = false, features = ["rustls", "backtrace", "contexts", "panic", "debug-images", "reqwest"] }
sentry-actix = "0.49.3"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_millis = "0.1.1"
socket2 = "0.6.5"
sqlx = { version = "0.9.0", features = ["mysql", "mysql-rsa", "postgres", "sqlite", "runtime-tokio", "tls-rustls-ring-webpki"] }
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
memcache = { version = "0.21.0", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
rand = "0.10.3"
base64 = "0.23.1"
toml = "1.1.8"
utoipa-swagger-ui = { version = "10.0.1", features = ["actix-web"] }
crossbeam-queue = "0.3.14"
smallvec = { version = "1.16.3", features = ["union", "const_generics"] }
ahash = "0.8.12"
indexmap = { version = "2.14.2", features = ["serde"] }
lz4_flex = { version = "0.14.0", default-features = false, features = ["std"] }
zstd = { version = "0.14.3", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
criterion = { version = "0.8.2", features = ["async_tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
io-uring = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "^0.1"

[[bench]]
name = "tracker_benchmarks"
harness = false

[package.metadata.bundle]
name = "Torrust Actix"
identifier = "com.power2all.torrust-actix"
icon = ["icon.ico"]
version = "4.2.24"
copyright = "Copyright (c) 2024-2026 Power2All"
category = "Public Utility"
short_description = "BitTorrent Tracker"
long_description = "A rich, fast and efficient Bittorrent Tracker."